# Local stack: FastAPI backend (serves the web UI) + Neo4j knowledge graph.
#   1. cp .env.example backend/.env   and set GEMINI_API_KEY (and NEO4J_PASSWORD)
#   2. docker compose up --build
#   3. open http://localhost:8000
name: constitution-ai

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-neo4j-password}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_OCR: ${INSTALL_OCR:-true}
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      ENABLE_NEO4J: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-neo4j-password}
      APP_HOST: 0.0.0.0
      ENABLE_EMBEDDINGS: ${ENABLE_EMBEDDINGS:-true}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
    volumes:
      - app-data:/data
      - ./backend/data/statutes:/app/backend/data/statutes:ro
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j-data:
  app-data:
